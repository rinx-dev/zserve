name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: zserv
            asset_name: zserv-linux-amd64
            extension: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: zserv
            asset_name: zserv-macos-amd64
            extension: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: zserv
            asset_name: zserv-macos-arm64
            extension: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: zserv.exe
            asset_name: zserv-windows-amd64.exe
            extension: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename and Compress (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          tar -czf ${{ matrix.asset_name }}.${{ matrix.extension }} ${{ matrix.asset_name }}

      - name: Rename and Compress (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          7z a ${{ matrix.asset_name }}.${{ matrix.extension }} ${{ matrix.asset_name }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}.${{ matrix.extension }}
